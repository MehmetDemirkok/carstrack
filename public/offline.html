<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f8f7fc" media="(prefers-color-scheme: light)">
  <title>Bağlantı yok — CarsTrack</title>
  <style>
    :root {
      --bg: #f8f7fc; --fg: #17171c; --muted: #6b6b7b; --card: #ffffff;
      --border: #e4e3ee; --primary: #4f6bed; --primary-fg: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #09090b; --fg: #f2f2f5; --muted: #9a9aab; --card: #15151b;
        --border: #26262f; --primary: #6d86ff; --primary-fg: #ffffff;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    }
    main {
      width: 100%;
      max-width: 360px;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px 24px;
    }
    img { width: 64px; height: 64px; border-radius: 16px; }
    h1 { font-size: 20px; margin: 20px 0 8px; }
    p { color: var(--muted); font-size: 15px; line-height: 1.5; margin: 0 0 24px; }
    button {
      appearance: none;
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 14px;
      background: var(--primary);
      color: var(--primary-fg);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
    .hint { font-size: 13px; margin: 16px 0 0; }
  </style>
</head>
<body>
  <main>
    <img src="/icon-192.png" alt="" width="64" height="64">
    <h1>İnternet bağlantısı yok</h1>
    <p>CarsTrack'e şu an ulaşılamıyor. Bağlantınız geri geldiğinde sayfa kendiliğinden yenilenecek.</p>
    <button type="button" id="retry">Tekrar dene</button>
    <p class="hint" id="status" aria-live="polite"></p>
  </main>
  <script>
    (function () {
      var status = document.getElementById("status");
      function retry() {
        status.textContent = "Bağlanılıyor…";
        location.reload();
      }
      document.getElementById("retry").addEventListener("click", retry);
      // Bağlantı geri gelince kullanıcıyı beklemeden yenile.
      window.addEventListener("online", retry);
    })();
  </script>
</body>
</html>
